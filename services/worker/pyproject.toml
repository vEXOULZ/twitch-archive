[project]
name = "archive-worker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "archive-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "google-api-python-client>=2.140",
  "google-auth>=2.34",
  "google-auth-oauthlib>=1.2",
  "yt-dlp[default]>=2025.11.12",  # seek-bar previews backfill (steps/previews.py)
  "defusedxml>=0.7.1",  # parses uploaded site tag shapes without DTDs or entities (svg_clean.py)
]

[project.scripts]
archive-worker = "archive_worker.main:run"

[tool.uv.sources]
archive-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archive_worker"]
