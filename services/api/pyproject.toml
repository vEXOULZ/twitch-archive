[project]
name = "archive-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["archive-common", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
archive-api = "archive_api.main:run"

[tool.uv.sources]
archive-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archive_api"]
