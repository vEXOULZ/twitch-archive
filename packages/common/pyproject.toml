[project]
name = "archive-common"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "tenacity>=8.5",
  "cachetools>=5.5",
  "tzdata>=2024.1",  # zoneinfo data for slim images / Windows
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archive_common"]
