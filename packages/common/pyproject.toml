[project]
name = "archive-common"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "tenacity>=8.5",
  "cachetools>=7.2.1",
  "tzdata>=2024.1",  # zoneinfo data for slim images / Windows
  # Shared jobs, API and audit conventions with doomtp-bot. The release tarball, not git+: the slim
  # Docker images have no git.
  "vex-platform[sqlalchemy] @ https://github.com/vEXOULZ/vex-platform/archive/refs/tags/v0.6.0.tar.gz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["archive_common"]
